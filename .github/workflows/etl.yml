name: etl

on:
  workflow_dispatch:
    inputs:
      etapas:
        # municipios fica de fora: o IBGE recusa conexões do GitHub Actions. Essa etapa
        # roda localmente (ver README, seção ETL).
        description: "Etapas separadas por espaço: ubs arboviroses"
        default: "ubs"
      sem_publicar:
        description: "Só extrair e validar, sem publicar no Hub"
        type: boolean
        default: false
  # Habilitar quando as etapas estiverem implementadas.
  # schedule:
  #   - cron: "0 6 * * 1"  # segundas, 03h de Brasília

# O `uv sync` de cada job instala só os grupos necessários; sem isto, o `uv run`
# sincronizaria de novo os grupos padrão (Jupyter, matplotlib) a cada execução.
env:
  UV_NO_SYNC: "1"

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      RADAR_HF_TOKEN: ${{ secrets.RADAR_HF_TOKEN }}
      RADAR_HF_DATASET_REPO: ${{ vars.RADAR_HF_DATASET_REPO }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group etl --no-default-groups
      - run: uv run python -m etl.pipeline ${{ inputs.etapas || 'ubs arboviroses' }} ${{ inputs.sem_publicar && '--sem-publicar' || '' }}

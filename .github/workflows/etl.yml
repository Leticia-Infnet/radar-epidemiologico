name: etl

on:
  workflow_dispatch:
    inputs:
      etapas:
        description: "Etapas separadas por espaço: municipios ubs arboviroses"
        default: "municipios ubs"
  # Habilitar quando as etapas estiverem implementadas.
  # schedule:
  #   - cron: "0 6 * * 1"  # segundas, 03h de Brasília

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      RADAR_HF_TOKEN: ${{ secrets.RADAR_HF_TOKEN }}
      RADAR_HF_DATASET_REPO: ${{ vars.RADAR_HF_DATASET_REPO }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group etl --no-default-groups
      - run: uv run python -m etl.pipeline ${{ inputs.etapas || 'municipios ubs arboviroses' }}

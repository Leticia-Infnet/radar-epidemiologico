name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --group etl --group ml --group app --no-default-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

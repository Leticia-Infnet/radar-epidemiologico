name: index

on:
  workflow_dispatch:

jobs:
  indexacao:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RADAR_HF_TOKEN: ${{ secrets.RADAR_HF_TOKEN }}
      RADAR_HF_DATASET_REPO: ${{ vars.RADAR_HF_DATASET_REPO }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group rag --group indexacao --no-default-groups
      - run: uv run python -m rag.ingest
      - run: uv run python -m rag.index

name: index

on:
  workflow_dispatch:
    inputs:
      sem_publicar:
        description: "Só indexar e avaliar, sem publicar no Hub"
        type: boolean
        default: false
      manuais:
        description: "Só estes ids de rag/fontes.yaml, separados por espaço (teste; não publica)"
        type: string
        default: ""

# O `uv sync` de cada job instala só os grupos necessários; sem isto, o `uv run`
# sincronizaria de novo os grupos padrão (Jupyter, matplotlib) a cada execução.
env:
  UV_NO_SYNC: "1"

jobs:
  indexacao:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RADAR_HF_TOKEN: ${{ secrets.RADAR_HF_TOKEN }}
      RADAR_HF_DATASET_REPO: ${{ vars.RADAR_HF_DATASET_REPO }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # `rag`: embeddings e busca; `indexacao`: Docling; `etl`: contratos e publicação no Hub.
      - run: uv sync --locked --group rag --group indexacao --group etl --no-default-groups
      - run: >-
          uv run python -m rag.index
          ${{ inputs.sem_publicar && '--sem-publicar' || '' }}
          ${{ inputs.manuais && format('--manuais {0}', inputs.manuais) || '' }}

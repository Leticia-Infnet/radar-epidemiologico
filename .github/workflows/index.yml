name: index

on:
  workflow_dispatch:

# O `uv sync` de cada job instala só os grupos necessários; sem isto, o `uv run`
# sincronizaria de novo os grupos padrão (Jupyter, matplotlib) a cada execução.
env:
  UV_NO_SYNC: "1"

jobs:
  indexacao:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RADAR_HF_TOKEN: ${{ secrets.RADAR_HF_TOKEN }}
      RADAR_HF_DATASET_REPO: ${{ vars.RADAR_HF_DATASET_REPO }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group rag --group indexacao --no-default-groups
      - run: uv run python -m rag.ingest
      - run: uv run python -m rag.index

name: deploy-space

on:
  push:
    branches: [main]
    paths: ["app/**", "common/**", "rag/**", "ml/**", "space/**", "pyproject.toml", "uv.lock"]
  workflow_dispatch:

jobs:
  deploy:
    # Só roda depois que o Space estiver configurado nas variáveis do repositório.
    if: vars.RADAR_HF_SPACE_REPO != ''
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.RADAR_HF_TOKEN }}
      SPACE: ${{ vars.RADAR_HF_SPACE_REPO }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Montar a pasta do Space
        run: |
          mkdir -p _space
          cp -r app common ml rag _space/
          cp space/README.md space/Dockerfile _space/
          # O grupo rag (torch) entra quando o chatbot for implementado.
          uv export --locked --no-hashes --no-dev --no-default-groups \
            --group app --group ml --no-emit-project > _space/requirements.txt
      - name: Publicar no Hugging Face Spaces
        run: |
          uv run --no-project --with huggingface_hub python - <<'PY'
          import os

          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["SPACE"]
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(
              repo_id=space,
              repo_type="space",
              folder_path="_space",
              commit_message=f"deploy: {os.environ['GITHUB_SHA'][:7]}",
          )
          PY
